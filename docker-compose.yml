version: "3.1"

# Values come from .env (copy .env.example and fill it in)
services:
  mysql:
    platform: linux/x86_64
    image: mysql:5.7.31
    container_name: "musicai_mysql"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8 --collation-server=utf8_unicode_ci
    restart: always
    ports:
      - 127.0.0.1:${DB_PORT:-3310}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-music}
    volumes:
      - mysql:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: "musicai_phpmyadmin"
    restart: always
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
    links:
      - mysql
    ports:
      - 127.0.0.1:8090:80

volumes:
  mysql:
